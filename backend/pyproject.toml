[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "avoirly"
version = "0.5.0"
description = "Spot invoice discrepancies. Simplify supplier claims."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "openai>=2,<3", "pypdf>=6,<7", "Pillow>=12,<13", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1", "PyJWT[crypto]>=2.12,<3", "httpx>=0.28,<1"]

[project.scripts]
avoirly = "recovery.cli:main"
avoirly-api = "recovery.api.app:main"
avoirly-worker = "recovery.worker:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real OpenAI extraction", "postgres: PostgreSQL integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
