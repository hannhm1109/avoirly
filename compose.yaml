services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avoirly
      POSTGRES_PASSWORD: local-avoirly-only
      POSTGRES_DB: avoirly
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - avoirly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avoirly -d avoirly"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  avoirly_pg:
