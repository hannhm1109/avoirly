# Infrastructure may be prepared before application accounts/origins are ready.
services:
  db:
    volumes:
      - ${SUPABASE_RUNTIME_DIR:?Set the private runtime directory}/volumes/db/tls:/var/lib/postgresql/tls:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"
  supavisor:
    ports: !reset []
  auth:
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?Generate asymmetric signing keys first}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_JWT_EXP: "900"
  storage:
    environment:
      JWT_JWKS: ${JWT_JWKS:?Generate asymmetric signing keys first}
      FILE_SIZE_LIMIT: "104857600"
  rest:
    environment:
      PGRST_JWT_SECRET: ${JWT_JWKS:?Generate asymmetric signing keys first}
